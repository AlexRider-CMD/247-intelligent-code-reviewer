<!doctype html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReviewOS — 24/7 AI Code Reviewer</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-950 text-white">
<header class="sticky top-0 z-20 border-b border-white/10 bg-slate-950/90 backdrop-blur"><div class="mx-auto flex max-w-7xl items-center justify-between px-6 py-4"><div><div class="text-xs uppercase tracking-[.3em] text-cyan-300">24/7 Intelligent</div><div class="text-xl font-bold">ReviewOS</div><div class="text-[10px] text-slate-500">AI Code Review · No login · No API key</div></div><div class="text-sm text-slate-500">Cloud AI Reviewer</div></div></header>
<main class="mx-auto max-w-7xl px-6 py-8">
<section class="grid gap-6 lg:grid-cols-[1.4fr_.6fr]"><div class="rounded-3xl border border-white/10 bg-white/[.04] p-5 shadow-2xl"><div class="mb-4 flex flex-wrap items-center gap-3"><input id="filename" value="Main.java" class="rounded-xl border border-white/10 bg-black/30 px-4 py-3 outline-none focus:border-cyan-400"><select id="language" class="rounded-xl border border-white/10 bg-black/30 px-4 py-3 outline-none"><option>Java</option><option>JavaScript</option><option>Python</option><option>SQL</option><option>C++</option></select><button id="review" class="ml-auto rounded-xl bg-cyan-400 px-5 py-3 font-bold text-slate-950 hover:bg-cyan-300 disabled:opacity-50">✦ Analyze Code</button></div><textarea id="code" spellcheck="false" class="min-h-[520px] w-full resize-y rounded-2xl border border-white/10 bg-[#070b12] p-5 font-mono text-sm leading-6 text-slate-200 outline-none focus:border-cyan-400">public class Main {
    public static void main(String[] args) {
        String password = "admin123";
        if (password == "admin123") {
            System.out.println("Access granted");
        }
    }
}</textarea><div id="status" class="mt-3 min-h-6 text-sm text-slate-400"></div></div>
<aside class="space-y-6"><div class="rounded-3xl border border-white/10 bg-white/[.04] p-6"><div class="text-xs uppercase tracking-[.25em] text-slate-500">AI Health Score</div><div id="score" class="mt-3 text-7xl font-black">—</div><p id="summary" class="mt-4 text-sm leading-6 text-slate-400">Paste code and analyze it for bugs, errors, security and quality.</p></div><div class="rounded-3xl border border-white/10 bg-white/[.04] p-6"><div class="text-xs uppercase tracking-[.25em] text-slate-500">Recent Reviews</div><div id="history" class="mt-4 space-y-3 text-sm"></div></div></aside></section>
<section class="mt-6 grid gap-6 lg:grid-cols-3"><div class="rounded-3xl border border-white/10 bg-white/[.04] p-6"><h2 class="font-bold">Findings</h2><div id="findings" class="mt-4 space-y-4 text-sm"></div></div><div class="rounded-3xl border border-white/10 bg-white/[.04] p-6"><h2 class="font-bold">Strengths</h2><ul id="strengths" class="mt-4 list-disc space-y-3 pl-5 text-sm text-slate-300"></ul></div><div class="rounded-3xl border border-white/10 bg-white/[.04] p-6"><h2 class="font-bold">Next Steps</h2><ul id="nextSteps" class="mt-4 list-disc space-y-3 pl-5 text-sm text-slate-300"></ul></div></section>
</main>
<script>
const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function loadHistory(){const r=await fetch('/api/history');if(!r.ok)return;const d=await r.json();$('history').innerHTML=d.length?d.map(x=>`<div class="rounded-xl border border-white/10 p-3"><div class="font-semibold">${esc(x.filename)}</div><div class="mt-1 text-xs text-slate-500">${esc(x.language)} · Score ${x.score}</div></div>`).join(''):'<div class="text-slate-500">No reviews yet.</div>';}
function render(d){$('score').textContent=d.score;$('summary').textContent=d.summary||'Review complete.';$('findings').innerHTML=d.findings.length?d.findings.map(f=>`<article class="rounded-2xl border border-white/10 p-4"><div class="flex justify-between gap-3"><b>${esc(f.title)}</b><span class="text-xs uppercase text-cyan-300">${esc(f.severity)}</span></div><div class="mt-2 text-slate-400">Line ${Number(f.line)||0}: ${esc(f.explanation)}</div><div class="mt-2 text-slate-200"><b>Fix:</b> ${esc(f.fix)}</div>${f.correctedCode?`<pre class="mt-3 overflow-auto rounded-xl bg-black/40 p-3 text-xs text-cyan-100">${esc(f.correctedCode)}</pre>`:''}</article>`).join(''):'<div class="rounded-xl border border-emerald-400/20 p-4 text-emerald-300">✓ No significant issues found.</div>';$('strengths').innerHTML=d.strengths.map(x=>`<li>${esc(x)}</li>`).join('');$('nextSteps').innerHTML=d.nextSteps.map(x=>`<li>${esc(x)}</li>`).join('');}
$('review').onclick=async()=>{const code=$('code').value.trim();if(!code)return $('status').textContent='Paste some code first.';$('review').disabled=true;$('status').textContent='Analyzing code for syntax, logic, security and quality issues…';try{const r=await fetch('/api/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,language:$('language').value,filename:$('filename').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'AI review failed.');render(d);$('status').textContent='✓ Review complete.';loadHistory();}catch(e){console.error(e);$('status').textContent='⚠ '+(e.message||'AI review failed.');}finally{$('review').disabled=false;}};
loadHistory();
</script></body></html>
