<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ReviewOS — Sign In</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-slate-950 text-white flex items-center justify-center p-6"><main class="w-full max-w-md rounded-3xl border border-white/10 bg-white/5 p-8 shadow-2xl"><div class="text-xs uppercase tracking-[.3em] text-cyan-300">24/7 Intelligent Code Reviewer</div><h1 class="mt-4 text-4xl font-bold">ReviewOS</h1><p class="mt-3 text-slate-400">Sign in to analyze code and keep your review history locally.</p><form id="form" class="mt-8 space-y-4"><input id="email" type="email" required placeholder="you@example.com" class="w-full rounded-xl border border-white/10 bg-black/30 p-4 outline-none focus:border-cyan-400"><button class="w-full rounded-xl bg-cyan-400 p-4 font-bold text-slate-950 hover:bg-cyan-300">Continue</button><p id="error" class="text-sm text-red-300"></p></form></main><script>form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:email.value})});const d=await r.json();if(!r.ok)return error.textContent=d.error||'Unable to sign in';location.href='/';});</script></body></html>
